<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tanulókártya PWA</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="src/ui/style.css">
  <link rel="icon" type="image/png" href="src/ui/assets/images/flash-cards.png">
</head>
<body>
  <header>
    <h1 style="display: flex; align-items: center; gap: 0.5rem;">
     <img src="src/ui/assets/images/flash-card.png" alt="Ikon" style="width: 32px; height: 32px; object-fit: contain;">
        Tanulókártyák
     </h1>
    <nav>
      <button class="btn" id="nav-decks">Paklik</button>
      <button class="btn" id="nav-stats">Statisztika</button>
    </nav>
  </header>
  <hr>

  <!-- PAKLIK NÉZET (Kezdőlap) -->
  <main id="view-decks">
    <h2>Paklijaim</h2>
    <div id="deck-list">Betöltés...</div>
    <hr>
    <h3>Új pakli importálása</h3>
    <input type="file" id="import-file" accept=".json">
    <hr>
    <h3>Pakli exportálása</h3>
    <button class="btn" id="export-btn">Exportálás (JSON)</button>
  </main>

  <!-- TANULÁS NÉZET (Kezdetben rejtett) -->
  <main id="view-study" class="hidden">
    <h2 id="study-title">Tanulás...</h2>
    <p>Ma esedékes kártyák: <span id="study-remaining">0</span></p>

    <div class="card" id="flashcard">
      <div id="card-front">Előlap szövege</div>
      <hr id="card-divider" class="hidden">
      <div id="card-back" class="hidden">Hátlap szövege</div>
    </div>

    <div id="study-controls" style="text-align: center;">
      <button class="btn btn-primary" id="btn-show">Mutasd (Space)</button>
      <div id="eval-controls" class="hidden">
        <button class="btn" data-q="1" title="Teljesen elfelejtettem">Újra (1)</button>
        <button class="btn" data-q="3" title="Nehezen jutott eszembe">Nehéz (2)</button>
        <button class="btn" data-q="4" title="Jól ment">Jó (3)</button>
        <button class="btn" data-q="5" title="Azonnal tudtam">Könnyű (4)</button>
      </div>
    </div>
    <br>
    <button class="btn" id="btn-back-decks">Vissza a paklikhoz</button>
  </main>

  <!-- STATISZTIKA NÉZET (Kezdetben rejtett) -->
  <main id="view-stats" class="hidden">
    <h2>Statisztika</h2>
    <div class="stats-grid">
      <div class="stat-box">Ma esedékes<br><span id="stat-due">0</span></div>
      <div class="stat-box">Új kártya<br><span id="stat-new">0</span></div>
      <div class="stat-box">Tanult<br><span id="stat-learned">0</span></div>
    </div>
    <h3>30 napos előrejelzés (Kártyák/Nap)</h3>
    <div class="chart-container" id ="forecast-chart">
        <!-- ide generalja a diagramot -->
    </div>
  </main>

  <!-- Kliensoldali logika betöltése ES modulként -->
  <script type="module" src="./src/ui/app.js"></script>
</body>
</html>
